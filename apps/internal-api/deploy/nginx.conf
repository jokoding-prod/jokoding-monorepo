# Jokoding Internal API (api.internal.jokoding.id) -> Node on 127.0.0.1:3300.
# deploy/install.sh installs this file and replaces api.internal.example.com with the domain.
# The frontend (internal.jokoding.id) is on Vercel; this site serves only the API.

server {
    listen 80;
    listen [::]:80;
    server_name api.internal.example.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Required: the login rate limiter trusts X-Real-IP (X-Forwarded-For is ignored).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
}
